# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs after E2E tests complete successfully
  workflow_run:
    workflows: ["E2E Tests"]
    types:
      - completed
    branches: ["main", "master"]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Deploy the commit E2E actually validated, not whatever landed on
          # the default branch since (see the same note in e2e-tests.yml).
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Build
        uses: docker://node:24-alpine
        with:
          args: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install --frozen-lockfile && pnpm run build:lib && pnpm run build:app"
        env:
          # do not report warnings as errors
          CI: false
          PUBLIC_URL: /Isenax/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload from the app's build directory in monorepo
          path: './packages/isenax-app/build/'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5