name: Release

on:
  # Runs after E2E tests pass, in parallel with the Pages deploy rather than
  # behind it: publishing a static site and cutting a version are independent,
  # and gating the release on Pages meant a Pages-side failure silently held
  # back a release whose tests had all passed.
  workflow_run:
    workflows: ["E2E Tests"]
    types:
      - completed
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Deliberately NOT pinned to workflow_run.head_sha like the other
          # jobs: semantic-release has to run on the release branch itself, and
          # a detached HEAD fails its branch check.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
