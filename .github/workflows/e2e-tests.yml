name: E2E Tests

on:
  pull_request:
    branches: ["main", "master"]
  workflow_run:
    workflows: ["Run Tests"]
    types:
      - completed
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'e2e-tests/requirements.txt'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          cd e2e-tests
          pip install -r requirements.txt

      - name: Build Isenax library
        run: pnpm run build:lib

      - name: Build Isenax app
        run: pnpm run build:app

      - name: Install serve globally
        run: npm install -g serve

      - name: Start Selenium Chrome in background
        run: |
          docker run -d \
            --name selenium-chrome \
            --network host \
            --shm-size=2g \
            selenium/standalone-chrome:latest

          echo "Waiting for Selenium to be ready..."
          timeout 60 bash -c 'until curl -sf http://localhost:4444/status; do sleep 2; done' || {
            echo "Selenium failed to start"
            docker logs selenium-chrome
            exit 1
          }
          echo "Selenium is ready"
          curl -s http://localhost:4444/status | jq '.' || true

      - name: Start Isenax server in background
        run: |
          cd packages/isenax-app/build
          nohup serve -s . -l 3000 > /tmp/server.log 2>&1 &
          echo $! > /tmp/server.pid
          echo "Server PID: $(cat /tmp/server.pid)"
          echo "Waiting for server to start..."
          timeout 60 bash -c 'until curl -sf http://localhost:3000; do sleep 2; done' || {
            echo "Server failed to start"
            echo "Server logs:"
            cat /tmp/server.log
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            exit 1
          }
          echo "Server is ready"
          echo "Server PID saved to /tmp/server.pid"
        env:
          CI: true

      - name: Verify connectivity before tests
        run: |
          echo "Testing app connectivity..."
          curl -sf http://localhost:3000 || echo "App not accessible"
          echo "Testing Selenium connectivity..."
          curl -sf http://localhost:4444/status || echo "Selenium not accessible"

      - name: Run E2E tests
        run: |
          cd e2e-tests
          pytest -v --tb=short
        env:
          ISENAX_TEST_URL: http://localhost:3000
          WEBDRIVER_URL: http://localhost:4444

      - name: Stop Selenium and Isenax server
        if: always()
        run: |
          echo "Stopping Selenium container..."
          docker stop selenium-chrome 2>/dev/null || true
          docker rm selenium-chrome 2>/dev/null || true

          if [ -f /tmp/server.pid ]; then
            echo "Stopping server (PID: $(cat /tmp/server.pid))"
            kill $(cat /tmp/server.pid) 2>/dev/null || true
            echo "Server logs:"
            cat /tmp/server.log || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-test-results
          path: e2e-tests/screenshots/
          if-no-files-found: ignore
          retention-days: 7
